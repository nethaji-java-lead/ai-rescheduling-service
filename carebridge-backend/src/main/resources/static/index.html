<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareBridge | Rescheduling Desk</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Segoe UI", sans-serif; color: #17313b; background: #f3f7f6; }
    body { margin: 0; }
    header { padding: 1.4rem max(1.5rem, calc((100vw - 1100px) / 2)); color: white; background: #145b58; }
    header h1 { margin: 0 0 .3rem; font-size: 1.5rem; }
    header p { margin: 0; color: #d8efeb; }
    main { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem 3rem; }
    .toolbar, .card, .panel { border: 1px solid #d7e3e0; border-radius: 12px; background: white; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1rem 1.2rem; }
    .toolbar h2, .panel h2 { margin: 0; font-size: 1.05rem; }
    #status { color: #536a70; font-size: .9rem; }
    .cards { display: grid; gap: 1rem; margin: 1rem 0 2rem; }
    .card { padding: 1.1rem 1.2rem; }
    .card-head { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; }
    .card h3 { margin: 0 0 .35rem; font-size: 1.05rem; }
    .muted { color: #536a70; }
    .badge { display: inline-block; border-radius: 99px; padding: .25rem .65rem; font-size: .78rem; font-weight: 700; white-space: nowrap; }
    .auto { color: #185e47; background: #dff4e8; }
    .manual { color: #79531b; background: #fff0d3; }
    .details { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .75rem; margin: 1rem 0; }
    .details div { padding: .7rem; border-radius: 8px; background: #f3f7f6; }
    .details strong { display: block; margin-bottom: .25rem; font-size: .78rem; color: #536a70; }
    .reason { border-left: 3px solid #48a69b; padding: .35rem .8rem; margin: 1rem 0; }
    button { border: 0; border-radius: 7px; padding: .6rem .9rem; cursor: pointer; font: inherit; font-weight: 650; }
    button:disabled { opacity: .55; cursor: wait; }
    .accept { color: white; background: #16705f; }
    .reject { color: #793e39; background: #f8e7e4; }
    .panel { padding: 1.1rem 1.2rem; margin-top: 1rem; }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-top: .8rem; }
    .control { display: grid; align-content: start; gap: .55rem; padding: .9rem; border-radius: 8px; background: #f3f7f6; }
    select { width: 100%; padding: .55rem; border: 1px solid #bdcfcb; border-radius: 6px; background: white; font: inherit; }
    .empty { padding: 2rem; text-align: center; color: #536a70; border: 1px dashed #bdcfcb; border-radius: 10px; background: white; }
    #error { color: #8b302b; margin: .7rem 0; }
    @media (max-width: 560px) { .toolbar, .card-head { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <h1>CareBridge Rescheduling Desk</h1>
    <p>Review AI-assisted recommendations and approve patient rebooks.</p>
  </header>
  <main>
    <section class="toolbar">
      <h2>Affected appointments</h2>
      <span id="status" aria-live="polite">Loading…</span>
    </section>
    <p id="error" role="alert"></p>
    <section id="suggestions" class="cards" aria-live="polite"></section>
    <section class="panel">
      <h2>Clinic availability controls</h2>
      <div class="controls">
        <div class="control">
          <label for="provider">Mark provider offline</label>
          <select id="provider"></select>
          <button id="offline" class="reject">Set offline</button>
        </div>
        <div class="control">
          <label for="slot">Cancel booked slot</label>
          <select id="slot"></select>
          <button id="cancel" class="reject">Cancel slot</button>
        </div>
        <div class="control">
          <label for="room">Mark room unavailable</label>
          <select id="room"></select>
          <button id="unavailable" class="reject">Set unavailable</button>
        </div>
        <div class="control">
          <label for="manual">Request a manual recommendation</label>
          <select id="manual"></select>
          <button id="request" class="accept">Ask scheduling advisor</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    const status = document.querySelector("#status");
    const error = document.querySelector("#error");
    const cards = document.querySelector("#suggestions");
    const formatTime = value => new Date(value).toLocaleString();
    const request = async (url, options) => {
      const response = await fetch(url, options);
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.message || `Request failed (${response.status})`);
      }
      return response.status === 204 ? null : response.json();
    };
    const fill = (select, items, label) => {
      select.replaceChildren(...items.map(item => {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = label(item);
        return option;
      }));
      select.disabled = items.length === 0;
    };
    const render = (suggestions, appointments) => {
      const appointmentById = new Map(appointments.map(item => [item.id, item]));
      const pending = suggestions.filter(item => appointmentById.has(item.appointmentId));
      const withSuggestions = new Set(pending.map(item => item.appointmentId));
      const waiting = appointments.filter(item => !withSuggestions.has(item.id));
      if (pending.length === 0 && waiting.length === 0) {
        cards.innerHTML = '<div class="empty">No appointments are awaiting rebooking approval.</div>';
        return;
      }
      const suggestionCards = pending.map(suggestion => {
        const appointment = appointmentById.get(suggestion.appointmentId);
        const article = document.createElement("article");
        article.className = "card";
        const trigger = suggestion.triggerReason === "INITIAL" ? "Manual trigger" : "Automatic trigger";
        article.innerHTML = `
          <div class="card-head">
            <div><h3></h3><span class="muted"></span></div>
            <span class="badge"></span>
          </div>
          <div class="details">
            <div><strong>Current appointment</strong><span class="current"></span></div>
            <div><strong>Recommended slot</strong><span class="recommended"></span></div>
            <div><strong>Confidence</strong><span class="confidence"></span></div>
          </div>
          <p class="reason"></p>
          <div><button class="accept">Accept and rebook</button> <button class="reject">Reject</button></div>`;
        article.querySelector("h3").textContent = appointment.patientName;
        article.querySelector(".muted").textContent = `${appointment.type} · appointment #${appointment.id}`;
        const badge = article.querySelector(".badge");
        badge.textContent = trigger;
        badge.classList.add(trigger.startsWith("Manual") ? "manual" : "auto");
        article.querySelector(".current").textContent = `${appointment.providerName} · ${formatTime(appointment.slotStartTime)}`;
        article.querySelector(".recommended").textContent =
          `${suggestion.alternateProviderName || appointment.providerName} · ${formatTime(suggestion.recommendedStartTime)}`;
        article.querySelector(".confidence").textContent = `${Math.round(suggestion.confidence * 100)}%`;
        article.querySelector(".reason").textContent = suggestion.reasoning;
        const buttons = article.querySelectorAll("button");
        buttons[0].addEventListener("click", () => decide(suggestion.id, "ACCEPTED", buttons));
        buttons[1].addEventListener("click", () => decide(suggestion.id, "REJECTED", buttons));
        return article;
      });
      const waitingCards = waiting.map(appointment => {
        const article = document.createElement("article");
        article.className = "card";
        const title = document.createElement("h3");
        title.textContent = appointment.patientName;
        const description = document.createElement("p");
        description.className = "muted";
        description.textContent = `${appointment.providerName} · appointment #${appointment.id} · no recommendation is currently pending`;
        const button = document.createElement("button");
        button.className = "accept";
        button.textContent = "Request another recommendation";
        button.addEventListener("click", () => requestManual(appointment.id, button));
        article.append(title, description, button);
        return article;
      });
      cards.replaceChildren(...suggestionCards, ...waitingCards);
    };
    const refresh = async () => {
      try {
        const [suggestions, appointments, providers, slots, rooms, confirmed] = await Promise.all([
          request("/suggestions?status=PENDING"),
          request("/appointments?status=RESCHEDULE_PENDING"),
          request("/providers"),
          request("/slots"),
          request("/rooms"),
          request("/appointments?status=CONFIRMED")
        ]);
        render(suggestions, appointments);
        fill(document.querySelector("#provider"), providers.filter(item => item.status === "AVAILABLE"),
          item => `${item.name} · ${item.specialty}`);
        fill(document.querySelector("#slot"), slots.filter(item => item.status === "BOOKED"),
          item => `${formatTime(item.startTime)} · ${item.providerName} · ${item.roomName}`);
        fill(document.querySelector("#room"), rooms.filter(item => item.available), item => item.name);
        const pendingIds = new Set(suggestions.map(item => item.appointmentId));
        const manualAppointments = [...confirmed, ...appointments.filter(item => !pendingIds.has(item.id))];
        fill(document.querySelector("#manual"), manualAppointments, item => `${item.patientName} · appointment #${item.id}`);
        status.textContent = `Updated ${new Date().toLocaleTimeString()}`;
        error.textContent = "";
      } catch (cause) {
        status.textContent = "Could not refresh";
        error.textContent = cause.message;
      }
    };
    const decide = async (id, decision, buttons) => {
      buttons.forEach(button => button.disabled = true);
      try {
        await request(`/suggestions/${id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ decision })
        });
        await refresh();
      } catch (cause) {
        error.textContent = cause.message;
        buttons.forEach(button => button.disabled = false);
      }
    };
    const update = async (url, body, successMessage) => {
      try {
        await request(url, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        status.textContent = successMessage;
        error.textContent = "";
        await refresh();
      } catch (cause) {
        error.textContent = cause.message;
      }
    };
    const requestManual = async (id, button) => {
      if (button) button.disabled = true;
      try {
        await request(`/appointments/${id}/suggest`, { method: "POST" });
        status.textContent = "Manual recommendation requested…";
        error.textContent = "";
        await refresh();
      } catch (cause) {
        error.textContent = cause.message;
        if (button) button.disabled = false;
      }
    };
    document.querySelector("#offline").addEventListener("click", () => {
      const id = document.querySelector("#provider").value;
      if (id) update(`/providers/${id}/status`, { status: "OFFLINE" }, "Provider unavailable; generating recommendations…");
    });
    document.querySelector("#cancel").addEventListener("click", () => {
      const id = document.querySelector("#slot").value;
      if (id) update(`/slots/${id}/status`, { status: "CANCELLED" }, "Slot cancelled; generating recommendations…");
    });
    document.querySelector("#unavailable").addEventListener("click", () => {
      const id = document.querySelector("#room").value;
      if (id) update(`/rooms/${id}/availability`, { available: false }, "Room unavailable; generating recommendations…");
    });
    document.querySelector("#request").addEventListener("click", async () => {
      const id = document.querySelector("#manual").value;
      if (!id) return;
      await requestManual(id, document.querySelector("#request"));
    });
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
