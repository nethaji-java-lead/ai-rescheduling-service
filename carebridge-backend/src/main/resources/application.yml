server:
  port: 8080

spring:
  application:
    name: carebridge-backend
  datasource:
    url: jdbc:h2:mem:carebridgedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
carebridge:
  ai:
    provider: lmstudio
    base-url: ${CAREBRIDGE_AI_BASE_URL:http://localhost:1235/v1}
    model: ${CAREBRIDGE_AI_MODEL:llama-3.2-3b-instruct}
    api-key: ${CAREBRIDGE_AI_API_KEY:lm-studio}

scheduling:
  strategy: ${SCHEDULING_STRATEGY:ai}

logging:
  level:
    com.carebridge: INFO
