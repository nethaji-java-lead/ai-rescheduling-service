server:
  port: 8080

spring:
  application:
    name: carebridge-backend
  datasource:
    url: jdbc:h2:mem:carebridgedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

scheduling:
  strategy: ${SCHEDULING_STRATEGY:rule-based}

logging:
  level:
    com.example.carebridge: INFO
