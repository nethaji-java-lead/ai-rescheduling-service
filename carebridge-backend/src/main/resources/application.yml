server:
  port: 8080

spring:
  application:
    name: carebridge-backend
  datasource:
    url: jdbc:h2:mem:carebridgedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  ai:
    openai:
      base-url: ${LOCAL_LLM_BASE_URL:http://localhost:1234/v1}
      api-key: ${LOCAL_LLM_API_KEY:local}
      chat:
        options:
          model: ${LOCAL_LLM_MODEL:wareef/Qwen3-VL-8B-Instruct-Q4_K_M-GGUF}
      audio:
        speech:
          enabled: false

scheduling:
  strategy: ${SCHEDULING_STRATEGY:rule-based}

logging:
  level:
    com.example.carebridge: INFO
